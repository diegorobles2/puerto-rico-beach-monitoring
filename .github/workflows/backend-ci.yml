name: Backend CI

on:
  push:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beach_monitoring_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d beach_monitoring_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/beach_monitoring_test
      NWS_PERSISTENCE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/beach_monitoring_test
      NWS_MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/beach_monitoring_migration_test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create Supabase-compatible database roles
        run: |
          PGPASSWORD=postgres psql \
            -h localhost \
            -U postgres \
            -d postgres \
            -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE anon NOLOGIN;" \
            -c "CREATE ROLE authenticated NOLOGIN;"

      - name: Create migration test database
        run: |
          PGPASSWORD=postgres psql \
            -h localhost \
            -U postgres \
            -d postgres \
            -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE beach_monitoring_migration_test;"

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Build backend
        run: npm run build

      - name: Run backend tests
        run: npm test -- --runInBand
